<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WINORO MUSIC PLAYER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --bg-1: #0f0c29;
            --bg-2: #302b63;
            --bg-3: #24243e;
            --accent: #a855f7;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: var(--text-main);
            overflow: hidden; 
        }

        #app-bg {
            background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-1));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* NEW: Crystal Glass Effect - Jernih dan Elegan */
        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.005));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .dynamic-accent { color: var(--accent) !important; }
        .dynamic-bg-accent { background-color: var(--accent) !important; }
        .dynamic-border-accent { border-color: var(--accent) !important; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; opacity: 0.5; }

        /* Range Slider Premium */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: var(--accent); cursor: pointer; margin-top: -6px;
            box-shadow: 0 0 12px var(--accent); transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid white;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); box-shadow: 0 0 20px var(--accent); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer;
            background: rgba(255, 255, 255, 0.15); border-radius: 2px;
        }

        /* Piringan Hitam (Vinyl) Realistis */
        .vinyl-texture {
            background: linear-gradient(30deg, transparent 40%, rgba(255,255,255,0.08) 50%, transparent 60%),
                        repeating-radial-gradient(#111 0%, #050505 1%, #111 2%);
        }
        
        /* Lapisan Kilap (Refleksi) Piringan */
        .vinyl-texture::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 45deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 15%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.1) 65%, rgba(255,255,255,0) 80%);
            pointer-events: none;
        }

        .spin { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease forwards; }
        .fade-out { animation: fadeOut 0.3s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(10px); } }

        /* Noise Halus */
        .noise-overlay {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body class="relative min-h-[100dvh] w-full flex items-center justify-center">

    <!-- Latar Belakang (Warna Animasi atau Foto Kustom) -->
    <div id="app-bg" class="absolute inset-0 z-0 transition-all duration-700"></div>
    <div class="noise-overlay"></div>
    
    <!-- NEW: Pencahayaan Panggung (Stage Lighting) -->
    <!-- Atas lebih jernih untuk melihat foto, bawah lebih gelap untuk membaca teks -->
    <div class="absolute inset-0 z-0 bg-gradient-to-b from-black/10 via-black/50 to-[#07070a] pointer-events-none"></div>

    <!-- Main Layout: 3 Panel Terpisah -->
    <div class="relative z-10 w-full max-w-md h-[100dvh] flex flex-col p-4 sm:p-5 gap-3 sm:gap-4 mx-auto">
        
        <!-- PANEL 1: HEADER & MENU -->
        <div class="glass-panel rounded-2xl p-4 flex justify-between items-center z-20 shrink-0">
            <div>
                <h1 class="text-xl font-extrabold tracking-tight">WINORO <span class="dynamic-accent font-light">MUSIC</span></h1>
            </div>
            
            <div class="relative">
                <button id="menu-btn" class="w-10 h-10 rounded-full flex justify-center items-center hover:bg-white/10 transition-colors focus:outline-none">
                    <i class="fas fa-bars text-xl text-white opacity-80 hover:opacity-100"></i>
                </button>

                <!-- Dropdown Menu -->
                <div id="dropdown-menu" class="hidden absolute right-0 mt-3 w-52 bg-gray-900/95 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl overflow-hidden z-50">
                    <input type="file" id="file-input" class="hidden" webkitdirectory directory multiple>
                    <label for="file-input" class="cursor-pointer flex items-center gap-3 px-5 py-3.5 hover:bg-white/10 transition-colors text-sm font-semibold border-b border-white/10">
                        <i class="fas fa-folder-plus dynamic-accent w-4 text-base"></i> Pilih Folder Lagu
                    </label>
                    <button id="menu-playlist-btn" class="w-full text-left flex items-center gap-3 px-5 py-3.5 hover:bg-white/10 transition-colors text-sm font-semibold border-b border-white/10 focus:outline-none">
                        <i class="fas fa-list-ul dynamic-accent w-4 text-base"></i> Buka Daftar Musik
                    </button>
                    <button id="menu-settings-btn" class="w-full text-left flex items-center gap-3 px-5 py-3.5 hover:bg-white/10 transition-colors text-sm font-semibold focus:outline-none">
                        <i class="fas fa-cog dynamic-accent w-4 text-base"></i> Pengaturan Tema
                    </button>
                </div>
            </div>
        </div>

        <!-- PANEL 2: VISUAL (Piringan/Kaset/Ombak/Foto) -->
        <!-- Menambahkan efek 'group' untuk animasi glow -->
        <div class="glass-panel rounded-[2rem] flex-1 min-h-0 flex items-center justify-center relative p-4 sm:p-6 group">
            
            <!-- NEW: Ambient Glow (Cahaya Pendar di belakang piringan) -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
                 <div class="w-[75%] h-[75%] rounded-full dynamic-bg-accent blur-[65px] opacity-10 group-hover:opacity-25 transition-opacity duration-700"></div>
            </div>

            <!-- Canvas untuk Visualizer Ombak -->
            <canvas id="wave-canvas" class="absolute inset-0 w-full h-full hidden z-10 opacity-80"></canvas>
            
            <!-- Wadah Rasio Presisi 1:1 -->
            <div id="visual-container" class="relative flex justify-center items-center z-20 transition-all duration-500" style="width: min(100%, 290px); height: min(100%, 290px); aspect-ratio: 1/1;">
                
                <!-- Default Vinyl -->
                <div id="disk-cover" class="w-full h-full rounded-full flex justify-center items-center vinyl-texture relative shadow-[0_20px_50px_rgba(0,0,0,0.7)] overflow-hidden" style="transform: translateZ(0); backface-visibility: hidden;">
                    <div id="disk-center" class="w-[30%] h-[30%] rounded-full dynamic-bg-accent border-2 border-[#333] flex justify-center items-center bg-cover bg-center z-10 shadow-lg">
                        <div class="w-3.5 h-3.5 bg-[#111] rounded-full shadow-inner"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- PANEL 3: KONTROL -->
        <div class="glass-panel rounded-[2rem] p-6 sm:p-7 flex flex-col gap-6 shrink-0 mb-1 relative z-20">
            <!-- Teks Informasi Lagu -->
            <div class="text-center px-1">
                <h2 id="song-title" class="text-2xl sm:text-[28px] font-black truncate drop-shadow-xl tracking-tight leading-tight text-white">Belum ada lagu</h2>
                <p id="song-artist" class="text-[11px] sm:text-xs mt-1.5 font-bold tracking-[0.2em] uppercase text-white/60">Pilih folder musik Anda</p>
            </div>

            <!-- Progress Bar -->
            <div class="flex flex-col gap-2 mt-1">
                <input type="range" id="progress-bar" value="0" min="0" max="100" class="w-full h-1">
                <div class="flex justify-between text-[10px] sm:text-xs font-bold tracking-widest text-white/50">
                    <span id="current-time">00:00</span>
                    <span id="duration-time">00:00</span>
                </div>
            </div>

            <!-- Tombol Putar -->
            <div class="flex justify-center items-center gap-8 mt-1">
                <button id="prev-btn" class="text-white/60 hover:text-white transition-all transform hover:scale-110 text-2xl focus:outline-none">
                    <i class="fas fa-backward-step"></i>
                </button>
                
                <button id="play-btn" class="w-16 h-16 sm:w-18 sm:h-18 dynamic-bg-accent text-white rounded-full flex justify-center items-center text-2xl sm:text-3xl transition-all transform hover:scale-105 shadow-[0_10px_25px_rgba(0,0,0,0.4)] hover:shadow-[0_10px_35px_rgba(0,0,0,0.6)] focus:outline-none border-2 border-white/20">
                    <i class="fas fa-play ml-1"></i>
                </button>
                
                <button id="next-btn" class="text-white/60 hover:text-white transition-all transform hover:scale-110 text-2xl focus:outline-none">
                    <i class="fas fa-forward-step"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- OVERLAY LACI -->
    <div id="drawer-overlay" class="fixed inset-0 bg-black/80 z-30 opacity-0 pointer-events-none transition-opacity duration-300 backdrop-blur-sm"></div>

    <!-- LACI DAFTAR MUSIK -->
    <div id="playlist-drawer" class="fixed inset-x-0 bottom-0 h-[70dvh] max-w-md mx-auto bg-[#0a0a0f]/95 backdrop-blur-2xl rounded-t-[2.5rem] border-t border-white/10 transform translate-y-full transition-transform duration-500 ease-[cubic-bezier(0.32,0.72,0,1)] z-40 flex flex-col shadow-[0_-20px_60px_rgba(0,0,0,0.8)]">
        <div id="close-drawer-btn" class="flex flex-col items-center pt-5 pb-3 cursor-pointer group">
            <div class="w-16 h-1.5 bg-white/20 group-hover:bg-white/50 rounded-full transition-colors"></div>
        </div>
        
        <div class="px-6 pb-4 pt-1 flex justify-between items-center border-b border-white/5 shrink-0">
            <h3 class="text-xs font-black uppercase tracking-widest text-white/80"><i class="fas fa-list mr-2 dynamic-accent"></i>Daftar Putar</h3>
            <span id="playlist-count" class="text-[10px] font-bold bg-white/5 px-3 py-1.5 rounded-full border border-white/10 dynamic-accent">0 Track</span>
        </div>
        
        <div class="flex-1 overflow-y-auto p-3 custom-scrollbar">
            <ul id="playlist" class="space-y-1.5 pb-8">
                <li class="text-sm text-center mt-12 font-medium opacity-50">Silakan pilih folder musik melalui menu.</li>
            </ul>
        </div>
    </div>

    <!-- MODAL PENGATURAN -->
    <div id="settings-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="bg-[#0a0a0f]/95 backdrop-blur-2xl border border-white/10 rounded-[2rem] w-full max-w-md p-6 shadow-2xl overflow-y-auto max-h-[90dvh] custom-scrollbar">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-black text-white"><i class="fas fa-sliders-h mr-2 dynamic-accent"></i> Pengaturan</h3>
                <button id="close-settings" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-gray-400 hover:text-white transition-colors focus:outline-none"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="mb-5 bg-white/5 p-4 rounded-2xl border border-white/5">
                <p class="text-[10px] text-gray-400 mb-3 uppercase tracking-wider font-bold"><i class="fas fa-bolt text-yellow-400 mr-1"></i> Audio Booster (Gain)</p>
                <div class="flex items-center gap-3">
                    <i class="fas fa-volume-down text-gray-400 text-xs"></i>
                    <input type="range" id="booster-slider" min="0.5" max="2.0" step="0.1" value="1" class="flex-1 h-1">
                    <span id="booster-val" class="text-xs font-bold dynamic-accent w-10 text-right">100%</span>
                </div>
            </div>

            <div class="mb-5 bg-white/5 p-4 rounded-2xl border border-white/5">
                <p class="text-[10px] text-gray-400 mb-3 uppercase tracking-wider font-bold"><i class="fas fa-eye dynamic-accent mr-1"></i> Tampilan Visual</p>
                <select id="visual-mode" class="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-sm text-white font-medium focus:outline-none focus:border-purple-500 transition-colors">
                    <option value="vinyl">Piringan Hitam (Vinyl)</option>
                    <option value="photo">Foto Kustom (Lingkaran)</option>
                    <option value="wave">Visualizer Ombak (Animasi)</option>
                    <option value="cassette">Kaset Pita (Retro)</option>
                </select>

                <div id="custom-photo-input-group" class="hidden mt-3">
                    <input type="file" id="disk-photo-input" accept="image/*" class="hidden">
                    <label for="disk-photo-input" class="w-full block text-center cursor-pointer bg-white/5 hover:bg-white/10 text-white text-[11px] font-bold py-3 rounded-xl transition-colors border border-white/10 uppercase tracking-wider">
                        <i class="fas fa-camera mr-1"></i> Upload Foto Pemutar
                    </label>
                </div>
            </div>

            <div class="mb-5 bg-white/5 p-4 rounded-2xl border border-white/5">
                <p class="text-[10px] text-gray-400 mb-3 uppercase tracking-wider font-bold"><i class="fas fa-image dynamic-accent mr-1"></i> Latar Belakang (Wallpaper)</p>
                <input type="file" id="bg-photo-input" accept="image/*" class="hidden">
                <div class="flex gap-2">
                    <label for="bg-photo-input" class="flex-1 text-center cursor-pointer bg-white/5 hover:bg-white/10 text-white text-[11px] font-bold py-3 rounded-xl transition-colors border border-white/10 uppercase tracking-wider">
                        <i class="fas fa-upload mr-1"></i> Ganti Latar
                    </label>
                    <button id="reset-bg-btn" class="px-4 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-bold py-3 rounded-xl transition-colors border border-red-500/20" title="Hapus Latar">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>

            <div class="mb-5">
                <p class="text-[10px] text-gray-400 mb-3 uppercase tracking-wider font-bold">Warna Tema (Aksen)</p>
                <div id="themes-grid" class="flex flex-wrap gap-3"></div>
            </div>

            <div class="mt-6 border-t border-white/5 pt-5">
                <button id="clear-db-btn" class="w-full text-[11px] uppercase tracking-wider text-red-400 font-bold px-4 py-3.5 bg-red-500/10 rounded-xl hover:bg-red-500/20 transition-colors border border-red-500/10">
                    <i class="fas fa-database mr-1"></i> Hapus Semua Lagu
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed top-5 left-1/2 transform -translate-x-1/2 bg-[#0a0a0f]/95 text-white px-6 py-3.5 rounded-full shadow-2xl border border-white/10 text-sm font-bold z-[200] backdrop-blur-md flex items-center gap-2"></div>

    <script>
        // --- DOM Elements ---
        const fileInput = document.getElementById('file-input');
        const playlistEl = document.getElementById('playlist');
        const songTitleEl = document.getElementById('song-title');
        const songArtistEl = document.getElementById('song-artist');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');
        const playlistCount = document.getElementById('playlist-count');
        
        const diskCover = document.getElementById('disk-cover');
        const waveCanvas = document.getElementById('wave-canvas');
        const appBg = document.getElementById('app-bg');
        
        const menuBtn = document.getElementById('menu-btn');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const menuPlaylistBtn = document.getElementById('menu-playlist-btn');
        const menuSettingsBtn = document.getElementById('menu-settings-btn');
        const playlistDrawer = document.getElementById('playlist-drawer');
        const drawerOverlay = document.getElementById('drawer-overlay');
        const closeDrawerBtn = document.getElementById('close-drawer-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings');
        const toast = document.getElementById('toast');

        // --- State ---
        const audioPlayer = new Audio();
        let songs = []; 
        let currentSongIndex = 0; 
        let isPlaying = false; 

        // --- Web Audio API (Booster & Visualizer) ---
        let audioCtx, audioSource, gainNode, analyser;
        let animationId;

        function initAudioEngine() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioSource = audioCtx.createMediaElementSource(audioPlayer);
            gainNode = audioCtx.createGain();
            analyser = audioCtx.createAnalyser();
            
            audioSource.connect(gainNode);
            gainNode.connect(analyser);
            analyser.connect(audioCtx.destination);
            
            analyser.fftSize = 256;
            
            const boost = localStorage.getItem('winoro_booster') || 1;
            gainNode.gain.value = parseFloat(boost);
        }

        // --- Visualizer (Ombak) ---
        function drawWave() {
            if (!analyser || document.getElementById('visual-mode').value !== 'wave') return;
            const container = document.getElementById('visual-container');
            waveCanvas.width = container.clientWidth;
            waveCanvas.height = container.clientHeight;
            const ctx = waveCanvas.getContext('2d');
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);
            
            ctx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
            
            const centerX = waveCanvas.width / 2;
            const centerY = waveCanvas.height / 2;
            const radius = waveCanvas.width * 0.22; 
            const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.fillStyle = '#0a0a0a';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = accentColor;
            ctx.shadowBlur = 20;
            ctx.shadowColor = accentColor;
            ctx.stroke();
            ctx.shadowBlur = 0;

            for (let i = 0; i < bufferLength; i += 4) {
                const barHeight = (dataArray[i] / 255) * (waveCanvas.width * 0.25);
                const rad = (i * 2 * Math.PI) / bufferLength;
                
                const startX = centerX + Math.cos(rad) * (radius + 8);
                const startY = centerY + Math.sin(rad) * (radius + 8);
                const endX = centerX + Math.cos(rad) * (radius + 8 + barHeight);
                const endY = centerY + Math.sin(rad) * (radius + 8 + barHeight);
                
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.strokeStyle = accentColor;
                ctx.shadowBlur = 15;
                ctx.shadowColor = accentColor;
                ctx.stroke();
            }

            if (isPlaying) {
                animationId = requestAnimationFrame(drawWave);
            }
        }

        // --- UI Utils ---
        function showToast(message, icon = 'check-circle') {
            toast.innerHTML = `<i class="fas fa-${icon} text-lg dynamic-accent"></i> <span>${message}</span>`;
            toast.classList.remove('hidden', 'fade-out');
            toast.classList.add('fade-in');
            setTimeout(() => {
                toast.classList.remove('fade-in');
                toast.classList.add('fade-out');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3000);
        }

        // --- Menus & Drawers ---
        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('hidden');
        });
        document.addEventListener('click', (e) => {
            if (!menuBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
                dropdownMenu.classList.add('hidden');
            }
        });

        menuPlaylistBtn.addEventListener('click', () => {
            dropdownMenu.classList.add('hidden');
            playlistDrawer.classList.remove('translate-y-full');
            drawerOverlay.classList.remove('opacity-0', 'pointer-events-none');
            drawerOverlay.classList.add('opacity-100', 'pointer-events-auto');
        });

        function closeModals() {
            playlistDrawer.classList.add('translate-y-full');
            drawerOverlay.classList.remove('opacity-100', 'pointer-events-auto');
            drawerOverlay.classList.add('opacity-0', 'pointer-events-none');
            settingsModal.classList.add('hidden');
        }
        closeDrawerBtn.addEventListener('click', closeModals);
        drawerOverlay.addEventListener('click', closeModals);

        menuSettingsBtn.addEventListener('click', () => {
            dropdownMenu.classList.add('hidden');
            settingsModal.classList.remove('hidden');
            drawerOverlay.classList.remove('opacity-0', 'pointer-events-none');
            drawerOverlay.classList.add('opacity-100', 'pointer-events-auto');
        });
        closeSettingsBtn.addEventListener('click', closeModals);

        // --- Themes ---
        const colors = ['#a855f7', '#06b6d4', '#10b981', '#f43f5e', '#f59e0b', '#3b82f6', '#ffffff'];
        const themesGrid = document.getElementById('themes-grid');
        colors.forEach(c => {
            const btn = document.createElement('button');
            btn.className = `w-9 h-9 rounded-full border-2 border-transparent hover:border-white transition-all hover:scale-110 shadow-lg`;
            btn.style.backgroundColor = c;
            btn.addEventListener('click', () => {
                document.documentElement.style.setProperty('--accent', c);
                localStorage.setItem('winoro_color', c);
                if(isPlaying) drawWave();
            });
            themesGrid.appendChild(btn);
        });

        // --- Visual Mode (FIXED BUG BUNGKUSAN KOTAK) ---
        const visualModeSelect = document.getElementById('visual-mode');
        const customPhotoGroup = document.getElementById('custom-photo-input-group');
        
        function updateVisualMode(mode) {
            waveCanvas.classList.add('hidden');
            
            // Hapus kelas dan style lama (Penting untuk anti-bocor)
            diskCover.className = 'flex justify-center items-center relative transition-all duration-500 overflow-hidden';
            diskCover.style.cssText = 'transform: translateZ(0); backface-visibility: hidden;';
            diskCover.innerHTML = '';
            
            customPhotoGroup.classList.add('hidden');

            if (mode === 'vinyl') {
                diskCover.className = 'w-full h-full rounded-full flex justify-center items-center relative shadow-[0_20px_50px_rgba(0,0,0,0.7)] transition-all duration-500 vinyl-texture overflow-hidden';
                diskCover.style.transform = 'translateZ(0)';
                diskCover.innerHTML = `<div id="disk-center" class="w-[32%] h-[32%] rounded-full dynamic-bg-accent border-4 border-[#1a1a1a] flex justify-center items-center z-10 shadow-2xl"><div class="w-4 h-4 bg-[#050505] rounded-full shadow-inner"></div></div>`;
                if(isPlaying) diskCover.classList.add('spin');
            } 
            else if (mode === 'cassette') {
                // Kaset berbentuk kotak panjang presisi
                diskCover.className = 'w-full aspect-[1.6/1] max-h-full flex justify-center items-center relative transition-all duration-500 rounded-xl sm:rounded-2xl overflow-hidden'; 
                diskCover.style.transform = 'translateZ(0)';
                
                diskCover.innerHTML = `
                    <div class="absolute inset-0 bg-gradient-to-b from-gray-300 to-gray-500 shadow-[inset_0_2px_15px_rgba(255,255,255,0.9),_0_20px_40px_rgba(0,0,0,0.6)] border-t-2 border-white/80 p-2.5 flex flex-col justify-between">
                        <!-- Label -->
                        <div class="h-[58%] w-full bg-[#f4f1e1] rounded-md border border-gray-400 flex flex-col justify-between p-1.5 shadow-sm relative overflow-hidden">
                            <div class="h-[45%] w-full bg-gradient-to-r from-red-500 via-orange-400 to-yellow-400 opacity-90 rounded-[3px]"></div>
                            <span class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-[10px] sm:text-xs font-black text-gray-800 tracking-[0.3em] bg-white/80 px-4 py-1 rounded shadow-sm backdrop-blur-md">WINORO</span>
                        </div>
                        <!-- Pita Tengah -->
                        <div class="relative w-[75%] h-[32%] bg-gray-900 mx-auto rounded-lg flex items-center justify-between px-4 border-2 border-gray-700 shadow-[inset_0_8px_20px_rgba(0,0,0,1)]">
                            <div class="h-0.5 bg-gray-700 w-full absolute top-1/2 left-0 transform -translate-y-1/2 z-0"></div>
                            <div class="w-10 h-10 rounded-full bg-gray-200 border-[3.5px] border-gray-800 flex items-center justify-center z-10 ${isPlaying?'spin':''}">
                                <div class="w-1.5 h-full bg-gray-800"></div><div class="h-1.5 w-full bg-gray-800 absolute"></div>
                            </div>
                            <div class="w-10 h-10 rounded-full bg-gray-200 border-[3.5px] border-gray-800 flex items-center justify-center z-10 ${isPlaying?'spin':''}">
                                <div class="w-1.5 h-full bg-gray-800"></div><div class="h-1.5 w-full bg-gray-800 absolute"></div>
                            </div>
                        </div>
                        <div class="absolute top-2.5 left-2.5 w-2 h-2 rounded-full bg-gray-600 shadow-inner"></div>
                        <div class="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-gray-600 shadow-inner"></div>
                    </div>
                `;
            }
            else if (mode === 'photo') {
                customPhotoGroup.classList.remove('hidden');
                
                // FIXED BUG: Memastikan gambar tidak tumpah dari lingkaran
                diskCover.className = 'w-full h-full rounded-full flex justify-center items-center relative transition-all duration-500 shadow-[0_20px_50px_rgba(0,0,0,0.7)] overflow-hidden';
                diskCover.style.transform = 'translateZ(0)'; // Webkit Safari Fix
                diskCover.style.backfaceVisibility = 'hidden';
                
                diskCover.style.border = '1.5px solid rgba(255,255,255,0.1)';
                diskCover.style.backgroundSize = 'cover';
                diskCover.style.backgroundPosition = 'center';
                
                const savedImg = localStorage.getItem('winoro_disk_img');
                if(savedImg) {
                    diskCover.style.backgroundImage = `url(${savedImg})`;
                } else {
                    diskCover.style.backgroundColor = '#111';
                    diskCover.innerHTML = `<div class="flex flex-col items-center opacity-40 text-white"><i class="fas fa-camera text-4xl mb-2"></i><span class="text-[10px] font-bold">FOTO</span></div>`;
                }
                
                // Ring kilap bagian atas
                diskCover.innerHTML += `<div class="absolute inset-0 rounded-full pointer-events-none shadow-[inset_0_0_40px_rgba(0,0,0,0.9),_inset_0_0_15px_rgba(255,255,255,0.2)] border border-white/5"></div>`;
                
                if(isPlaying) diskCover.classList.add('spin');
            }
            else if (mode === 'wave') {
                waveCanvas.classList.remove('hidden');
                diskCover.className = 'w-full h-full rounded-full flex justify-center items-center relative transition-all duration-500 overflow-hidden';
                diskCover.style.transform = 'translateZ(0)';
                diskCover.innerHTML = `<i class="fas fa-music text-6xl opacity-5 text-white z-0 drop-shadow-2xl"></i>`; 
                if(isPlaying) drawWave();
            }
            localStorage.setItem('winoro_visual_mode', mode);
        }

        visualModeSelect.addEventListener('change', (e) => updateVisualMode(e.target.value));

        // --- Custom Image Uploads ---
        document.getElementById('disk-photo-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    localStorage.setItem('winoro_disk_img', e.target.result);
                    updateVisualMode('photo');
                }
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('bg-photo-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    localStorage.setItem('winoro_bg_img', e.target.result);
                    appBg.style.backgroundImage = `url(${e.target.result})`;
                    appBg.style.animation = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('reset-bg-btn').addEventListener('click', () => {
            localStorage.removeItem('winoro_bg_img');
            appBg.style.backgroundImage = '';
            appBg.style.animation = 'gradientBG 15s ease infinite';
        });

        // --- Booster Control ---
        const boosterSlider = document.getElementById('booster-slider');
        const boosterVal = document.getElementById('booster-val');
        boosterSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            boosterVal.innerText = Math.round(val * 100) + '%';
            if (gainNode) gainNode.gain.value = val;
            localStorage.setItem('winoro_booster', val);
        });

        // --- Load Saved Settings ---
        function loadSettings() {
            const c = localStorage.getItem('winoro_color');
            if(c) document.documentElement.style.setProperty('--accent', c);
            
            const vMode = localStorage.getItem('winoro_visual_mode') || 'vinyl';
            visualModeSelect.value = vMode;
            updateVisualMode(vMode);
            
            const bg = localStorage.getItem('winoro_bg_img');
            if(bg) {
                appBg.style.backgroundImage = `url(${bg})`;
                appBg.style.animation = 'none';
            }

            const boost = localStorage.getItem('winoro_booster') || 1;
            boosterSlider.value = boost;
            boosterVal.innerText = Math.round(boost * 100) + '%';
        }
        loadSettings();

        // --- IndexedDB ---
        const dbName = "WinoroPremiumDB";
        let db;
        const requestDB = indexedDB.open(dbName, 1);
        
        requestDB.onupgradeneeded = (e) => {
            db = e.target.result;
            if(!db.objectStoreNames.contains("songs")) {
                db.createObjectStore("songs", { keyPath: "id", autoIncrement: true });
            }
        };
        requestDB.onsuccess = (e) => {
            db = e.target.result;
            loadSongsFromDB(); 
        };

        function saveFolderToDB(files) {
            showToast("Memproses lagu... Mohon tunggu.", "spinner fa-spin");
            const transaction = db.transaction(["songs"], "readwrite");
            const store = transaction.objectStore("songs");
            store.clear(); 

            let count = 0;
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file.type.startsWith('audio/') || file.name.match(/\.(mp3|wav|m4a|flac|ogg)$/i)) {
                    let fileName = file.name.replace(/\.[^/.]+$/, "");
                    let title = fileName;
                    let artist = "Unknown Artist";
                    if(fileName.includes(" - ")) {
                        const parts = fileName.split(" - ");
                        artist = parts[0].trim();
                        title = parts.slice(1).join(" - ").trim();
                    }
                    store.add({ fileBlob: file, title: title, artist: artist });
                    count++;
                }
            }

            transaction.oncomplete = () => {
                if(count > 0) {
                    showToast(`${count} Lagu diimpor! Memutar musik...`, "check-circle");
                    loadSongsFromDB(true); 
                } else {
                    showToast("Tidak ada musik di folder ini.", "exclamation-triangle");
                }
            };
        }

        function loadSongsFromDB(autoPlayAfterImport = false) {
            if(!db) return;
            const transaction = db.transaction(["songs"], "readonly");
            const store = transaction.objectStore("songs");
            const request = store.getAll();

            request.onsuccess = () => {
                songs = [];
                request.result.forEach(record => {
                    const fileUrl = URL.createObjectURL(record.fileBlob);
                    songs.push({ title: record.title, artist: record.artist, url: fileUrl });
                });

                if (songs.length > 0) {
                    playlistCount.innerText = `${songs.length} Track`;
                    renderPlaylist();
                    loadSong(0); 

                    if (autoPlayAfterImport) {
                        setTimeout(() => playSong(), 300);
                    }
                } else {
                    playlistCount.innerText = `0 Track`;
                    playlistEl.innerHTML = `<li class="text-xs text-center mt-12 font-medium opacity-50 uppercase tracking-widest">Folder Kosong</li>`;
                    songTitleEl.innerText = "Belum ada lagu";
                    songArtistEl.innerText = "Pilih folder musik Anda";
                }
            };
        }

        document.getElementById('clear-db-btn').addEventListener('click', () => {
            const tx = db.transaction(["songs"], "readwrite");
            tx.objectStore("songs").clear();
            tx.oncomplete = () => {
                showToast("Semua lagu dihapus.", "trash");
                songs = [];
                pauseSong();
                loadSongsFromDB();
                closeModals();
            };
        });

        fileInput.addEventListener('change', (event) => {
            const files = event.target.files; 
            if (files.length === 0) return;
            dropdownMenu.classList.add('hidden'); 
            saveFolderToDB(files);
        });

        // --- Audio Logic ---
        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function renderPlaylist() {
            playlistEl.innerHTML = ''; 
            songs.forEach((song, index) => {
                const li = document.createElement('li');
                const isActive = index === currentSongIndex;
                
                li.className = `p-3.5 rounded-2xl cursor-pointer transition-all flex items-center gap-4 group 
                    ${isActive ? 'bg-white/10 border border-white/10' : 'bg-transparent border border-transparent hover:bg-white/5'}`;
                
                li.innerHTML = `
                    <div class="flex-shrink-0 w-8 text-center">
                        ${isActive && isPlaying 
                            ? `<div class="flex items-end justify-center gap-1 h-4">
                                 <div class="w-1.5 dynamic-bg-accent rounded-t h-full animate-[bounce_0.9s_infinite]"></div>
                                 <div class="w-1.5 dynamic-bg-accent rounded-t h-2/3 animate-[bounce_1.2s_infinite]"></div>
                                 <div class="w-1.5 dynamic-bg-accent rounded-t h-1/2 animate-[bounce_0.7s_infinite]"></div>
                               </div>` 
                            : `<span class="text-xs font-bold ${isActive ? 'dynamic-accent' : 'opacity-40'}">${index + 1}</span>`
                        }
                    </div>
                    <div class="flex flex-col flex-1 min-w-0">
                        <span class="truncate text-sm font-bold ${isActive ? 'text-white' : 'opacity-80 group-hover:text-white'}">${song.title}</span>
                        <span class="truncate text-[10px] mt-1 tracking-widest uppercase ${isActive ? 'dynamic-accent' : 'opacity-50'}">${song.artist}</span>
                    </div>
                `;

                li.addEventListener('click', () => {
                    loadSong(index);
                    playSong();
                });
                playlistEl.appendChild(li);
            });
        }

        function loadSong(index) {
            currentSongIndex = index;
            audioPlayer.src = songs[index].url;
            songTitleEl.innerText = songs[index].title;
            songArtistEl.innerText = songs[index].artist;
            renderPlaylist(); 
        }

        function playSong() {
            if (songs.length === 0) return showToast("Pilih folder lagu dulu!", "exclamation-circle");
            
            initAudioEngine();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            isPlaying = true;
            audioPlayer.play();
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            
            const mode = document.getElementById('visual-mode').value;
            if(mode === 'vinyl' || mode === 'photo') diskCover.classList.add('spin');
            if(mode === 'cassette') {
                diskCover.querySelectorAll('.rounded-full.bg-gray-200').forEach(el => el.classList.add('spin'));
            }
            if(mode === 'wave') drawWave();
            
            renderPlaylist(); 
        }

        function pauseSong() {
            isPlaying = false;
            audioPlayer.pause();
            playBtn.innerHTML = '<i class="fas fa-play ml-1"></i>';
            
            diskCover.classList.remove('spin'); 
            diskCover.querySelectorAll('.rounded-full.bg-gray-200').forEach(el => el.classList.remove('spin'));
            cancelAnimationFrame(animationId);
            
            renderPlaylist();
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) pauseSong();
            else playSong();
        });

        function prevSong() {
            if (songs.length === 0) return;
            currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            loadSong(currentSongIndex);
            playSong();
        }

        function nextSong() {
            if (songs.length === 0) return;
            currentSongIndex = (currentSongIndex + 1) % songs.length;
            loadSong(currentSongIndex);
            playSong();
        }

        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        audioPlayer.addEventListener('ended', nextSong);

        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration) {
                progressBar.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                currentTimeEl.innerText = formatTime(audioPlayer.currentTime);
                durationTimeEl.innerText = formatTime(audioPlayer.duration);
            }
        });

        progressBar.addEventListener('input', (e) => {
            if(audioPlayer.duration) {
                audioPlayer.currentTime = (e.target.value / 100) * audioPlayer.duration;
            }
        });
    </script>
</body>
</html>
