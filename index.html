    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {

        .border-theme-3 { border-color: var(--accent-3) !important; }

        #app-bg {
            background: linear-gradient(-45deg, #09090e, #13111c, #0a0f18, #000000);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .noise-overlay {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent-1); border-radius: 10px; opacity: 0.3; }

        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: var(--accent-3); cursor: pointer; margin-top: -6px;
            box-shadow: 0 0 10px var(--accent-3); transition: transform 0.2s;
            border: 2px solid white;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer;
            background: rgba(255, 255, 255, 0.15); border-radius: 2px;
        }

        .vinyl-texture {
            background: linear-gradient(30deg, transparent 40%, rgba(255,255,255,0.06) 50%, transparent 60%),

        .vinyl-texture::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;

        .spin { animation: spin 4s linear infinite; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(8px); } }

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const dropdownMenu = document.getElementById('dropdown-menu');

        // Audio Elemen
        const audioPlayer = new Audio();
        let songs = []; 
        let currentSongIndex = 0; 
        let isPlaying = false; 

        // PWA Install Logic
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        document.getElementById('menu-install-btn').addEventListener('click', async () => {
            dropdownMenu.classList.add('hidden');
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') showToast("Mendownload Aplikasi...");

        function initAudioEngine() {

            gainNode = audioCtx.createGain();
            analyser = audioCtx.createAnalyser();
            
            audioSource.connect(gainNode);
            gainNode.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 256;
            
            const boost = localStorage.getItem('winoro_booster') || 1;
            gainNode.gain.value = parseFloat(boost);

        const waveCanvas = document.getElementById('wave-canvas');
        function drawWave() {
            if (!analyser || document.getElementById('visual-mode').value !== 'wave') return;
            waveCanvas.width = waveCanvas.parentElement.clientWidth;
            waveCanvas.height = waveCanvas.parentElement.clientHeight;
            const ctx = waveCanvas.getContext('2d');
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);
            
            ctx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
            const centerX = waveCanvas.width / 2;
            const centerY = waveCanvas.height / 2;
            const radius = waveCanvas.width * 0.28; 
            
            const accent2 = getComputedStyle(document.documentElement).getPropertyValue('--accent-2').trim();

            for (let i = 0; i < bufferLength; i += 4) {
                const barHeight = (dataArray[i] / 255) * (waveCanvas.width * 0.25);
                const rad = (i * 2 * Math.PI) / bufferLength;
                
                const startX = centerX + Math.cos(rad) * radius;
                const startY = centerY + Math.sin(rad) * radius;
                const endX = centerX + Math.cos(rad) * (radius + barHeight);
                const endY = centerY + Math.sin(rad) * (radius + barHeight);
                
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.strokeStyle = accent2;
                ctx.shadowBlur = 15;
                ctx.shadowColor = accent2;
                ctx.stroke();
            }

            if (isPlaying) animationId = requestAnimationFrame(drawWave);
        }

        const dbName = "WinoroPremiumDB";
        let db;
        const requestDB = indexedDB.open(dbName, 1);
        requestDB.onupgradeneeded = (e) => {
            db = e.target.result;

        function saveFolderToDB(files) {
            showToast("Memproses file audio... Mohon tunggu.");
            const transaction = db.transaction(["songs"], "readwrite");
            const store = transaction.objectStore("songs");
            store.clear(); 

            let count = 0;
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file.type.startsWith('audio/') || file.name.match(/\.(mp3|wav|m4a|flac|ogg)$/i)) {
                    let fileName = file.name.replace(/\.[^/.]+$/, "");
                    let title = fileName;
                    let artist = "Unknown Artist";
                    if(fileName.includes(" - ")) {
                        const parts = fileName.split(" - ");
                        artist = parts[0].trim();
                        title = parts.slice(1).join(" - ").trim();
                    }
                    store.add({ fileBlob: file, title: title, artist: artist });
                    count++;
                }
            }

            transaction.oncomplete = () => {
                if(count > 0) {
                    showToast(`${count} Lagu berhasil diimpor!`);
                    loadSongsFromDB(true); 
                } else {
                    showToast("Tidak ditemukan file audio di folder ini.");
                }
            };
        }

        function loadSongsFromDB(autoPlay = false) {
            if(!db) return;
            const transaction = db.transaction(["songs"], "readonly");
            const store = transaction.objectStore("songs");
            const request = store.getAll();

            request.onsuccess = () => {
                songs = [];
                request.result.forEach(record => {
                    const fileUrl = URL.createObjectURL(record.fileBlob);
                    songs.push({ title: record.title, artist: record.artist, url: fileUrl });
                });

                if (songs.length > 0) {
                    playlistCount.innerText = `${songs.length} Track`;
                    renderPlaylist();
                    loadSong(0); 
                    
                    if(autoPlay) playSong();
                } else {

                    playlistEl.innerHTML = `<li class="text-sm text-center mt-12 font-light opacity-50">Tidak ada lagu tersimpan.</li>`;

                        ${isActive && isPlaying

                                 <div class="w-1.5 bg-theme-3 rounded-t h-1/2 animate-[bounce_0.7s_infinite]"></div>
                               </div>` 
                            : `<span class="text-sm font-bold ${isActive ? 'text-theme-1' : 'opacity-40'}">${index + 1}</span>`
                        }
                    </div>
                    <div class="flex flex-col flex-1 min-w-0">
                        <span class="truncate text-sm font-bold ${isActive ? 'text-white' : 'opacity-80 group-hover:text-white'}">${song.title}</span>
                        <span class="truncate text-[10px] mt-0.5 tracking-widest uppercase ${isActive ? 'text-theme-1' : 'opacity-50'}">${song.artist}</span>
                    </div>
                `;
                li.addEventListener('click', () => { loadSong(index); playSong(); closeModals(); });
                playlistEl.appendChild(li);

        function loadSong(index) {
            currentSongIndex = index;
            audioPlayer.src = songs[index].url;

            songArtistEl.innerText = songs[index].artist;
            renderPlaylist();

        const playBtn = document.getElementById('play-btn');
        function playSong() {
            if (songs.length === 0) return showToast("Pilih folder musik dulu!", "exclamation-circle");
            initAudioEngine();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            isPlaying = true;
            audioPlayer.play();
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            
            const mode = document.getElementById('visual-mode').value;
            if(mode === 'vinyl' || mode === 'photo') diskCover.classList.add('spin');
            if(mode === 'cassette') diskCover.querySelectorAll('.rounded-full.bg-gray-200').forEach(el => el.classList.add('spin'));
            if(mode === 'wave') drawWave();
            renderPlaylist(); 
        }

        function pauseSong() {
            isPlaying = false;
            audioPlayer.pause();

            diskCover.classList.remove('spin'); 
            diskCover.querySelectorAll('.rounded-full.bg-gray-200').forEach(el => el.classList.remove('spin'));
            cancelAnimationFrame(animationId);
            renderPlaylist();
        }

        playBtn.addEventListener('click', () => isPlaying ? pauseSong() : playSong());
        document.getElementById('prev-btn').addEventListener('click', () => { if(songs.length){ currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length; loadSong(currentSongIndex); playSong(); }});
        document.getElementById('next-btn').addEventListener('click', () => { if(songs.length){ currentSongIndex = (currentSongIndex + 1) % songs.length; loadSong(currentSongIndex); playSong(); }});
        audioPlayer.addEventListener('ended', () => { if(songs.length){ currentSongIndex = (currentSongIndex + 1) % songs.length; loadSong(currentSongIndex); playSong(); }});

        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');
        
        function formatTime(sec) {
            if (isNaN(sec)) return "00:00";
            return `${Math.floor(sec/60).toString().padStart(2,'0')}:${Math.floor(sec%60).toString().padStart(2,'0')}`;
        }
        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration) {
                progressBar.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                currentTimeEl.innerText = formatTime(audioPlayer.currentTime);
                durationTimeEl.innerText = formatTime(audioPlayer.duration);
            }
        });
        progressBar.addEventListener('input', (e) => { if(audioPlayer.duration) audioPlayer.currentTime = (e.target.value / 100) * audioPlayer.duration; });

    </script>
</body>
</html>
